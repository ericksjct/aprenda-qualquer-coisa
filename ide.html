<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editor — Aprenda Qualquer Coisa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, sans-serif; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: .75rem; padding: .5rem .75rem;
    border-bottom: 1px solid light-dark(#ddd, #333);
    background: light-dark(#f7f7f7, #1e1e1e);
  }
  header h1 { font-size: .95rem; font-weight: 600; }
  header .path { font-size: .8rem; opacity: .7; flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; font-size: .85rem; padding: .3rem .8rem; cursor: pointer;
    border: 1px solid light-dark(#ccc, #444); border-radius: 6px;
    background: light-dark(#fff, #2d2d2d); color: inherit;
  }
  button:hover { background: light-dark(#eee, #3a3a3a); }
  button:disabled { opacity: .4; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  #tree {
    width: 260px; overflow: auto; padding: .5rem; font-size: .85rem;
    border-right: 1px solid light-dark(#ddd, #333);
    background: light-dark(#fafafa, #252526);
  }
  #tree ul { list-style: none; padding-left: 1rem; }
  #tree > ul { padding-left: 0; }
  #tree li { padding: .1rem 0; }
  #tree .dir > span { cursor: pointer; font-weight: 600; opacity: .85; }
  #tree .dir > span::before { content: "▸ "; font-size: .7em; }
  #tree .dir.open > span::before { content: "▾ "; }
  #tree .dir > ul { display: none; }
  #tree .dir.open > ul { display: block; }
  #tree .file { cursor: pointer; border-radius: 4px; padding: .1rem .3rem; }
  #tree .file:hover { background: light-dark(#e8e8e8, #37373d); }
  #tree .file.active { background: light-dark(#dbe9ff, #094771); }
  #editor { flex: 1; min-width: 0; }
  #editor textarea {
    width: 100%; height: 100%; border: 0; resize: none; padding: 1rem;
    font: .9rem/1.5 ui-monospace, Consolas, monospace;
    background: light-dark(#fff, #1e1e1e); color: inherit; outline: none;
  }
  #hint {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 2rem;
    color: light-dark(#666, #999); pointer-events: none;
  }
  #hint div { max-width: 34rem; line-height: 1.6; }
  .dirty::after { content: " ●"; color: #e2b93d; }
</style>
</head>
<body>
<header>
  <h1>Aprenda Qualquer Coisa</h1>
  <span class="path" id="path">.projetos/</span>
  <button id="reload">Recarregar</button>
  <button id="save" disabled>Salvar (Ctrl+S)</button>
</header>
<main>
  <nav id="tree"></nav>
  <section id="editor" style="position:relative">
    <div id="hint"><div id="hintmsg">
      <p>Carregando seus projetos…</p>
    </div></div>
  </section>
</main>
<script>
"use strict";
// ponytail: arvore e conteudo vem da API do serve-editor.ps1 (localhost),
// rooteada em .projetos/ — abre ja carregado, funciona em qualquer navegador.
// Monaco via CDN com fallback pra <textarea> se estiver offline.
const LANGS = { js: "javascript", ts: "typescript", py: "python", md: "markdown",
                html: "html", htm: "html", css: "css", json: "json", ps1: "powershell",
                yml: "yaml", yaml: "yaml", txt: "plaintext", csv: "plaintext" };
const BINARY = /\.(png|jpe?g|gif|pdf|xlsx?|db|ico|zip)$/i;

let currentPath = null, dirty = false;
let monacoEditor = null, textarea = null;

const $ = (id) => document.getElementById(id);

function setDirty(v) {
  dirty = v;
  $("save").disabled = !v;
  $("path").classList.toggle("dirty", v);
}
function hint(html) {
  const box = $("hint");
  if (html === null) { if (box) box.remove(); return; }
  if (box) $("hintmsg").innerHTML = html;
}

// --- editor: Monaco se a CDN responder, senao textarea ----------------------
function initTextarea() {
  textarea = document.createElement("textarea");
  textarea.spellcheck = false;
  textarea.addEventListener("input", () => setDirty(true));
  $("editor").appendChild(textarea);
}
function getValue() { return monacoEditor ? monacoEditor.getValue() : textarea.value; }
function setValue(text, ext) {
  if (monacoEditor) {
    monacoEditor.setValue(text);
    monaco.editor.setModelLanguage(monacoEditor.getModel(), LANGS[ext] || "plaintext");
  } else {
    textarea.value = text;
  }
}
const loader = document.createElement("script");
loader.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js";
loader.onload = () => {
  require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs" } });
  require(["vs/editor/editor.main"], () => {
    const value = textarea ? textarea.value : "";
    if (textarea) { textarea.remove(); textarea = null; }
    monacoEditor = monaco.editor.create($("editor"), {
      value, language: "plaintext", automaticLayout: true,
      theme: matchMedia("(prefers-color-scheme: dark)").matches ? "vs-dark" : "vs",
      minimap: { enabled: false }, fontSize: 14, wordWrap: "on",
    });
    monacoEditor.onDidChangeModelContent(() => setDirty(true));
  });
};
loader.onerror = initTextarea; // offline: segue funcionando sem highlighting
document.head.appendChild(loader);

// --- arvore via API ----------------------------------------------------------
function renderTree(nodes, ul, base) {
  for (const node of [].concat(nodes || [])) {
    const li = document.createElement("li");
    const rel = base ? base + "/" + node.name : node.name;
    if (node.type === "dir") {
      li.className = "dir";
      const label = document.createElement("span");
      label.textContent = node.name;
      label.addEventListener("click", () => li.classList.toggle("open"));
      const sub = document.createElement("ul");
      renderTree(node.children, sub, rel);
      li.append(label, sub);
    } else {
      li.className = "file";
      li.textContent = node.name;
      li.addEventListener("click", () => openFile(rel, li));
    }
    ul.appendChild(li);
  }
}

async function loadTree() {
  let nodes;
  try {
    const r = await fetch("/api/tree");
    if (!r.ok) throw new Error(r.status);
    nodes = await r.json();
  } catch {
    hint(location.protocol === "file:"
      ? "<p><strong>Quase lá!</strong> Este editor não funciona aberto direto do " +
        "arquivo.</p><p style='margin-top:.75rem'>Feche esta aba e dê dois cliques " +
        "em <strong><code>abrir-editor.cmd</code></strong> (na mesma pasta).</p>"
      : "<p>Não consegui falar com o servidor do editor.</p>" +
        "<p style='margin-top:.75rem'>Abra pelo <strong><code>abrir-editor.cmd" +
        "</code></strong> e deixe a janelinha preta aberta.</p>");
    return;
  }
  $("tree").innerHTML = "";
  const ul = document.createElement("ul");
  $("tree").appendChild(ul);
  renderTree(nodes, ul, "");
  if (![].concat(nodes || []).length) {
    hint("<p>Nenhum projeto ainda em <code>.projetos/</code>.</p>" +
         "<p style='margin-top:.75rem'>Volte ao mentor e rode " +
         "<strong><code>/novo-projeto</code></strong> pra começar.</p>");
  } else {
    hint("<p><strong>Escolha um arquivo</strong> na árvore à esquerda.</p>" +
         "<p style='margin-top:.75rem'>Edite e salve com Ctrl+S. Pra ver uma página " +
         "HTML sua funcionando, dê dois cliques nela no Explorer.</p>");
    // 1 projeto so? ja abre a pasta dele
    const dirs = document.querySelectorAll("#tree > ul > li.dir");
    if (dirs.length === 1) dirs[0].classList.add("open");
  }
}

async function openFile(rel, li) {
  if (dirty && !confirm("Ha alteracoes nao salvas. Descarta-las?")) return;
  if (BINARY.test(rel)) {
    alert("Esse tipo de arquivo nao abre aqui — de dois cliques nele no Explorer.");
    return;
  }
  const r = await fetch("/api/file?path=" + encodeURIComponent(rel));
  if (!r.ok) { alert("Nao consegui abrir: " + rel); return; }
  hint(null);
  currentPath = rel;
  setValue(await r.text(), rel.split(".").pop().toLowerCase());
  setDirty(false);
  $("path").textContent = ".projetos/" + rel;
  document.querySelectorAll("#tree .file.active").forEach(e => e.classList.remove("active"));
  li.classList.add("active");
}

async function save() {
  if (!currentPath || !dirty) return;
  const r = await fetch("/api/file?path=" + encodeURIComponent(currentPath),
                        { method: "PUT", body: getValue() });
  if (r.ok) setDirty(false);
  else alert("Falha ao salvar (" + r.status + "). A janelinha preta ainda esta aberta?");
}

$("reload").addEventListener("click", loadTree);
$("save").addEventListener("click", save);
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});
addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
loadTree();
</script>
</body>
</html>
